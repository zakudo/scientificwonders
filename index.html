    // --- WIKIPEDIA LINK COMPONENT ---
    function WikipediaLink({ name, url, role, className = "" }) {
      return (
        <a
          href={url}
          target="_blank"
          rel="noopener noreferrer"
          title={`Open the Wikipedia article for ${name} (opens in a new tab)`}
          className={`inline-flex items-center gap-1 font-medium text-[#171614] hover:text-[#6E1F2A] border-b border-[#6E1F2A]/40 hover:border-[#6E1F2A] pb-0.5 transition-all duration-200 group ${className}`}
        >
          <span>{name}</span>
          <span className="text-xs text-[#6E1F2A] transition-transform duration-200 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 font-mono">↗</span>
          {role && <span className="text-xs text-[#5C5851] font-normal font-sans">({role})</span>}
        </a>
      );
    }

    // --- ENGLISH AUDIO PRONUNCIATION HOOK ---
    function useFrenchSpeech() {
      const speak = (text) => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'en-US';
          utterance.rate = 0.9;
          const voices = window.speechSynthesis.getVoices();
          const frenchVoice = voices.find(v => v.lang.startsWith('fr'));
          if (frenchVoice) utterance.voice = frenchVoice;
          window.speechSynthesis.speak(utterance);
        }
      };
      return { speak };
    }

    // --- FULLSCREEN LIGHTBOX MODAL ---
    function ImageLightbox({ image, onClose }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape") onClose();
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [onClose]);

      if (!image) return null;

      return (
        <div 
          className="fixed inset-0 z-50 flex items-center justify-center bg-[#0d0c0b]/95 backdrop-blur-sm p-4 sm:p-8 animate-fade-in"
          onClick={onClose}
        >
          <div 
            className="relative max-w-5xl max-h-[92vh] flex flex-col bg-[#FAF6EE] border border-[#A58A55] rounded-xs overflow-hidden shadow-2xl"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Header */}
            <div className="flex items-center justify-between px-6 py-3.5 bg-[#E6DDCB] border-b border-[#D6CEBE]">
              <div className="flex items-center gap-2 text-[#6E1F2A] text-xs sm:text-sm tracking-wider uppercase font-mono font-semibold">
                <span>🏛️ Archive Document</span>
                <span className="text-[#A58A55]">•</span>
                <span className="text-[#171614] font-sans normal-case text-xs font-semibold">{image.title}</span>
              </div>
              <button
                onClick={onClose}
                className="flex items-center gap-1.5 px-3 py-1 text-xs text-[#171614] hover:text-[#6E1F2A] bg-[#FAF6EE] hover:bg-[#F2EBDD] border border-[#D6CEBE] rounded-xs transition-colors font-mono"
              >
                <span>Close</span>
                <span className="text-sm font-mono">✕</span>
              </button>
            </div>

            {/* Image display */}
            <div className="relative flex-1 flex items-center justify-center p-4 sm:p-6 bg-[#171614] overflow-hidden min-h-[320px]">
              <img
                src={image.src}
                alt={image.title}
                className="max-h-[66vh] w-auto max-w-full object-contain rounded-xs shadow-lg select-none"
                onError={(e) => {
                  if (image.fallbackSrc && e.target.src !== image.fallbackSrc) {
                    e.target.src = image.fallbackSrc;
                  }
                }}
              />
            </div>

            {/* Caption */}
            <div className="px-6 py-4 bg-[#FAF6EE] border-t border-[#D6CEBE] text-sm space-y-1.5">
              <div className="text-[#171614] font-serif text-base italic leading-relaxed">
                "{image.caption}"
              </div>
              <div className="text-[#5C5851] text-xs leading-relaxed font-sans">
                {image.englishCaption}
              </div>
              <div className="pt-2 flex flex-wrap items-center justify-between text-[11px] text-[#6E1F2A] border-t border-[#D6CEBE]/60 font-mono">
                <span>Artist / Source: {image.artist}</span>
                <span>Collection: {image.location}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // ADAPTED COMPONENT: ANIMATED HISTORICAL STORY SEQUENCE
    // =========================================================================
    function AnimatedHistoricalSequence({ slides, onOpenLightbox }) {
      const [active, setActive] = useState(0);

      const handleNext = () => {
        setActive((prev) => (prev + 1) % slides.length);
      };

      const handlePrev = () => {
        setActive((prev) => (prev - 1 + slides.length) % slides.length);
      };

      const randomRotations = [-2.5, 2, -1.5, 2.5, -2, 1.5];
      const currentSlide = slides[active];

      return (
        <div className="w-full bg-[#EAE2D2]/90 border border-[#D1C7B4] rounded-xs p-6 sm:p-10 my-8 shadow-sm relative">
          
          {/* Document Number & Metadata Header */}
          <div className="flex items-center justify-between border-b border-[#D1C7B4] pb-2.5 mb-6 text-[10px] font-mono uppercase tracking-widest text-[#5C5851]">
            <span>HISTORICAL DOCUMENT № 0{active + 1} / 0{slides.length}</span>
            <span className="text-[#6E1F2A] font-semibold">{currentSlide.tag || "NATIONAL ARCHIVE"}</span>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
            
            {/* Stacked Animated Archival Image Frame */}
            <div className="lg:col-span-5 relative min-h-[320px] sm:min-h-[380px] flex items-center justify-center">
              {slides.map((slide, index) => {
                const isActive = index === active;
                const offset = index - active;
                const rotation = randomRotations[index % randomRotations.length];

                return (
                  <div
                    key={index}
                    onClick={() => {
                      if (isActive && onOpenLightbox) {
                        onOpenLightbox({
                          src: slide.image,
                          fallbackSrc: slide.image,
                          title: slide.title,
                          artist: slide.period,
                          location: slide.location || "France",
                          caption: slide.subtitle,
                          englishCaption: slide.description
                        });
                      } else {
                        setActive(index);
                      }
                    }}
                    style={{
                      zIndex: isActive ? 20 : 10 - Math.abs(offset),
                      transform: isActive
                        ? `rotate(0deg) scale(1)`
                        : `rotate(${rotation}deg) scale(0.93) translateY(${offset * 10}px)`,
                      opacity: isActive ? 1 : Math.max(0.25, 0.55 - Math.abs(offset) * 0.2),
                      transition: "all 0.5s cubic-bezier(0.16, 1, 0.3, 1)",
                    }}
                    className={`absolute inset-0 w-full h-full rounded-xs overflow-hidden shadow-md cursor-pointer border bg-[#171614] ${
                      isActive ? "border-[#6E1F2A] ring-1 ring-[#6E1F2A]/30" : "border-[#C5BBA7]"
                    }`}
                  >
                    <img
                      src={slide.image}
                      alt={slide.title}
                      className="w-full h-full object-cover object-center select-none"
                    />
                    {isActive && (
                      <div className="absolute bottom-0 inset-x-0 bg-gradient-to-t from-[#171614]/95 via-[#171614]/50 to-transparent p-3.5 text-[11px] font-mono text-[#F2EBDD] flex items-center justify-between">
                        <span>🔍 Click to enlarge</span>
                        <span className="uppercase text-[9px] tracking-wider text-[#A58A55] font-semibold">{slide.period}</span>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            {/* Narrative Content Card */}
            <div className="lg:col-span-7 flex flex-col justify-between space-y-4">
              <div className="space-y-3">
                <div className="flex items-center justify-between gap-2 border-b border-[#D1C7B4] pb-2">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 bg-[#6E1F2A] text-[#F2EBDD] text-xs font-mono font-bold rounded-xs">
                      {currentSlide.period}
                    </span>
                    <span className="text-xs font-mono text-[#5C5851] uppercase tracking-wider">
                      {currentSlide.location}
                    </span>
                  </div>
                  <span className="text-xs font-mono text-[#6E1F2A] font-bold">
                    0{active + 1} / 0{slides.length}
                  </span>
                </div>

                <h3 className="text-2xl sm:text-3xl md:text-4xl font-serif font-bold text-[#171614] leading-tight tracking-tight">
                  {currentSlide.title}
                </h3>

                <p className="text-xs font-mono text-[#6E1F2A] uppercase tracking-widest font-semibold">
                  {currentSlide.subtitle}
                </p>

                <p className="text-sm sm:text-base text-[#5C5851] leading-relaxed font-sans pt-1">
                  {currentSlide.description}
                </p>

                {currentSlide.quote && (
                  <div className="bg-[#E5DCC9] border-l-2 border-[#6E1F2A] p-3 rounded-r-xs text-xs text-[#171614] font-serif italic leading-relaxed">
                    {currentSlide.quote}

                </p>
              </div>

              <div className="bg-[#FAF6EE] border border-[#D1C7B4] p-6 rounded-xs space-y-3">
                <div className="text-4xl">🧠</div>
                <h4 className="text-xl font-serif font-bold text-[#171614]">Philippe Pinel</h4>
                <p className="text-xs font-mono text-[#6E1F2A] uppercase font-semibold">THE HUMAN MIND</p>
                <p className="text-xs text-[#5C5851] leading-relaxed">
                  Misunderstood psychological suffering transformed into a humane medical discipline.
                </p>
              </div>
            </div>

            {/* Climax Stanza */}
            <div className="bg-[#171614] text-[#F2EBDD] border border-[#A58A55] p-10 sm:p-14 rounded-xs space-y-3">
              <h3 className="text-2xl sm:text-4xl font-serif font-bold leading-tight">
                SCIENCE TRANSFORMS THE WORLD
              </h3>
              <div className="text-2xl sm:text-4xl font-serif font-bold text-[#A58A55] italic">
                WHEN IT TEACHES US TO SEE WHAT WE COULD NOT SEE.
              </div>
            </div>
          </section>


          {/* ========================================================= */}
          {/* SECTION 05 — EXTENDED INTERACTIVE TIMELINE */}
          {/* ========================================================= */}
          <section id="timeline" className="py-24 px-6 sm:px-12 max-w-6xl mx-auto border-b border-[#D6CEBE] space-y-12">
            
            <div className="space-y-3">
              <span className="chapter-tag">05 — RESEARCH CHRONOLOGY (1790–1960)</span>
              <h2 className="text-3xl sm:text-5xl font-serif font-bold text-[#171614]">
                The Documentary Timeline
              </h2>
              <p className="text-sm text-[#5C5851] max-w-2xl font-light">
                Click a time marker to view the corresponding archives.
              </p>
            </div>

            {/* Timeline Nodes */}
            <div className="space-y-6">
              <div className="relative py-4">
                <div className="absolute top-1/2 left-0 right-0 h-0.5 bg-[#D1C7B4] -translate-y-1/2 z-0" />
                <div className="relative z-10 flex items-center justify-between gap-2 overflow-x-auto pb-2 scrollbar-none">
                  {timelineEvents.map((ev, index) => {
                    const isSelected = index === selectedTimelineIndex;
                    return (
                      <button
                        key={index}
                        onClick={() => setSelectedTimelineIndex(index)}
                        className="flex flex-col items-center group focus:outline-none transition-all duration-200 min-w-[95px]"
                      >
                        <div
                          className={`w-9 h-9 rounded-xs flex items-center justify-center text-sm border transition-all duration-300 ${
                            isSelected
                              ? "bg-[#6E1F2A] text-[#F2EBDD] border-[#6E1F2A] scale-110 shadow-md font-bold"
                              : "bg-[#FAF6EE] text-[#171614] border-[#D1C7B4] group-hover:border-[#6E1F2A]"
                          }`}
                        >
                          <span>{ev.icon}</span>
                        </div>
                        <span
                          className={`mt-2 font-mono text-xs transition-colors ${
                            isSelected ? "text-[#6E1F2A] font-bold" : "text-[#5C5851] group-hover:text-[#171614]"
                          }`}
                        >
                          {ev.year}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Milestone Spotlight Card */}
              <div className="bg-[#FAF6EE] border border-[#D1C7B4] rounded-xs p-6 sm:p-8 shadow-sm space-y-3">
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-[#D1C7B4] pb-3">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl p-2 bg-[#E6DDCB] rounded-xs border border-[#D1C7B4]">{activeTimeline.icon}</span>
                    <div>
                      <span className="text-xs font-mono uppercase text-[#6E1F2A] font-semibold">{activeTimeline.year} • {activeTimeline.figure}</span>
                      <h3 className="text-xl sm:text-2xl font-serif font-bold text-[#171614]">{activeTimeline.title}</h3>
                    </div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => setSelectedTimelineIndex((prev) => (prev > 0 ? prev - 1 : timelineEvents.length - 1))}
                      className="px-3 py-1 bg-[#FAF6EE] border border-[#D1C7B4] hover:border-[#6E1F2A] rounded-xs text-xs text-[#171614] font-mono"
                    >
                      ← Previous
                    </button>
                    <button
                      onClick={() => setSelectedTimelineIndex((prev) => (prev < timelineEvents.length - 1 ? prev + 1 : 0))}
                      className="px-3 py-1 bg-[#FAF6EE] border border-[#D1C7B4] hover:border-[#6E1F2A] rounded-xs text-xs text-[#171614] font-mono"
                    >
                      Next →
                    </button>
                  </div>
                </div>

                <p className="text-sm sm:text-base text-[#5C5851] leading-relaxed font-sans pt-1">
                  {activeTimeline.desc}
                </p>
              </div>
            </div>
          </section>


          {/* ========================================================= */}
          {/* SECTION 06 — SOURCES & ACADEMIC BIBLIOGRAPHY */}
          {/* ========================================================= */}
          <footer id="sources" className="py-24 px-6 sm:px-12 max-w-6xl mx-auto text-xs text-[#5C5851] space-y-10">
            <div className="border-t border-[#D6CEBE] pt-10 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div className="space-y-1">
                <span className="chapter-tag">06 — SOURCES & SCIENTIFIC CREDITS</span>
                <h4 className="text-2xl font-serif font-bold text-[#171614]">
                  Archives & Academic References
                </h4>
              </div>
              <a href="#intro" className="font-mono text-[#6E1F2A] hover:underline flex items-center gap-1 font-semibold">
                <span>Back to top ↑</span>
              </a>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-xs font-mono">
              <div className="bg-[#FAF6EE] p-4 rounded-xs border border-[#D1C7B4] space-y-1">
                <strong className="text-[#171614] block">01 — Institut Pasteur</strong>
                <p className="text-[11px] text-[#5C5851]">Rue d'Ulm archives and Musée Pasteur collections, Paris.</p>
              </div>
              <div className="bg-[#FAF6EE] p-4 rounded-xs border border-[#D1C7B4] space-y-1">
                <strong className="text-[#171614] block">02 — Curie Museum</strong>
                <p className="text-[11px] text-[#5C5851]">Archives of the Radium Institute, CNRS, and Université Paris Cité.</p>
              </div>
              <div className="bg-[#FAF6EE] p-4 rounded-xs border border-[#D1C7B4] space-y-1">
                <strong className="text-[#171614] block">03 — Academy of Medicine</strong>
                <p className="text-[11px] text-[#5C5851]">Tony Robert-Fleury collection and Pinel's nosological treatises.</p>
              </div>
              <div className="bg-[#FAF6EE] p-4 rounded-xs border border-[#D1C7B4] space-y-1">
                <strong className="text-[#171614] block">04 — NobelPrize.org & Gallica</strong>
                <p className="text-[11px] text-[#5C5851]">Official Nobel Prize citations and BNF photographic collection.</p>
              </div>
            </div>

            <div className="pt-8 border-t border-[#D6CEBE] flex flex-col sm:flex-row items-center justify-between gap-4 text-[11px] font-mono text-[#7A756D]">
              <span>The Sciences That Changed Human Life • Digital Exhibition</span>
              <span>« Knowledge is the heritage of humanity. »</span>
            </div>
          </footer>


          {/* DISCRETE PRESENTATION CONTROLS (Bottom Right) */}
          <div className="fixed bottom-5 right-5 z-40 flex items-center gap-2 bg-[#FAF6EE]/95 backdrop-blur border border-[#C5BBA7] px-3 py-1.5 rounded-xs text-xs font-mono shadow-md opacity-80 hover:opacity-100 transition-opacity text-[#171614]">
            <button
              onClick={() => setIsSpeakerNotesOpen((prev) => !prev)}
              className={`px-2.5 py-1 rounded-xs transition-all flex items-center gap-1.5 ${
                isSpeakerNotesOpen
                  ? "bg-[#6E1F2A] text-[#F2EBDD] font-bold"
                  : "text-[#171614] hover:text-[#6E1F2A]"
              }`}
              title="Show presenter notes (N key)"
            >
              <span>🎙️</span>
              <span className="hidden sm:inline">Notes (N)</span>
            </button>
            <span className="text-[#D1C7B4]">•</span>
            <button
              onClick={() => {
                if (!document.fullscreenElement) {
                  document.documentElement.requestFullscreen().catch(() => {});
                } else {
                  document.exitFullscreen().catch(() => {});
                }
              }}
              className="px-2.5 py-1 rounded-xs text-[#171614] hover:text-[#6E1F2A] transition-colors flex items-center gap-1.5"
              title="Fullscreen (F key)"
            >
              <span>⛶</span>
              <span className="hidden sm:inline">Fullscreen (F)</span>
            </button>
          </div>

          {/* FULLSCREEN LIGHTBOX MODAL */}
          {activeLightboxImage && (
            <ImageLightbox
              image={activeLightboxImage}
              onClose={() => setActiveLightboxImage(null)}
            />
          )}

          {/* SPEAKER NOTES DRAWER */}
          <SpeakerNotesDrawer
            isOpen={isSpeakerNotesOpen}
            onClose={() => setIsSpeakerNotesOpen(false)}
          />

        </div>
      );
    }

    // Render root
    const rootElement = document.getElementById("root");
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<DigitalDocumentaryApp />);
    }
  </script>
</body>
</html>
